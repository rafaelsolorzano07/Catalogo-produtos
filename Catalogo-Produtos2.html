<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catalogo-produtos</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }

        .catalogo {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .div-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            width: 200px;
        }

        .div-card h3 {
            margin-top: 0;
            font-size: 16px;
        }

        .span-categoria {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .span-preco {
            font-weight: bold;
            color: green;
        }

        .filtro-erro {
            color: red;
        }
    </style>
</head>
<body>
    
    <h1>Catálogo Produtos</h1>

    <form>
        <label for="filtro">Pesquisar pela categoria</label>
        <input type="text" name="filtro" id="filtro">
        <button onclick="mostrarCatalogoProdutos(event)">Pesquisar</button>
    </form>

    <br>

    <div class="catalogo" id="div-catalogo"></div>

    <script>
        const catalogoProdutos = [
            ['Notebook Dell i7 14" 500GB SSD 16RAM', 7859.59, 'notebook'],
            ['Notebook Lenovo i5 15" 250GB SSD 16RAM', 5699.00, 'notebook'],
            ['Impressora Epson EcoTank', 999.00, 'impressora'],
            ['Iphone 17 Pro Max 256GB', 4500.99, 'celular'],
            ['Samsung Galaxy S26 Ultra 256GB', 3500.99, 'celular'],
            ['Mouse HP 150 Wireless Sem Fio', 67.67, 'acessorios']
        ];

        const divCatalogo = document.getElementById('div-catalogo');

        function mostrarCatalogoProdutos(event) {
            if(event) event.preventDefault();

            const filtro = document.getElementById('filtro')
                .value
                .trim()
                .toLowerCase();

            let produtosFiltrados = [];
            divCatalogo.innerHTML = '';

            if (filtro !== '') {
                produtosFiltrados = catalogoProdutos
                    .filter(produto => produto[2].toLowerCase() === filtro);
            } else {
                produtosFiltrados = catalogoProdutos;
            }

            if(produtosFiltrados.length === 0) {
                divCatalogo.innerHTML = `<p class="filtro-erro">Nao há produtos nesta categoria</p>`;
                return;
            }

            produtosFiltrados.forEach((produto) => {
                const divCard = document.createElement('div');
                divCard.classList.add('div-card');

                const h3 = document.createElement('h3');
                h3.innerHTML = produto[0];

                const spanCategoria = document.createElement('span');
                spanCategoria.innerHTML = produto[2];
                spanCategoria.classList.add('span-categoria');

                const spanPreco = document.createElement('span');
                spanPreco.innerHTML = `R$ ${produto[1].toFixed(2).replace('.', ',')}`;
                spanPreco.classList.add('span-preco');

                divCard.append(h3);
                divCard.append(spanCategoria);
                divCard.append(spanPreco);

                divCatalogo.append(divCard);
            });
        }
    </script>
</body>
</html>
